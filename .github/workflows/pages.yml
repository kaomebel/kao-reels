# Dasturni internet saytga joylaydi: https://kaomebel.github.io/kao-reels/
# Tayyor fayllar gh-pages branch'iga qo'yiladi; GitHub Pages saytni shu branch'dan ko'rsatadi
# (Settings → Pages → Branch: gh-pages, / (root)).
name: Saytni joylash

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: gh-pages branch'ini yangilash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-web.js
      - name: www/ ni gh-pages branch'iga yozish
        working-directory: www
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sayt: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
