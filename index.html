<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">

  <title>Biznes Tizim</title>
  <meta name="theme-color" content="#17324d">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="manifest.webmanifest">

<body>
  <div id="auth" hidden>

    <div id="syncBanner" class="sync-banner" hidden></div>
